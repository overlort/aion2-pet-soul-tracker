name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests on real packets
        working-directory: src
        run: |
          python test_aionwire.py
          python test_pets.py
          python test_ui_logic.py
          python test_catalog.py
