name: Release

# Релиз выпускается, когда меняется файл VERSION (или вручную из вкладки Actions):
# собрать AionSoulTracker.exe на Windows и создать релиз vX.Y.Z с этим exe.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller lz4

      - name: Tests
        working-directory: src
        run: |
          python test_aionwire.py
          python test_pets.py
          python test_ui_logic.py
          python test_catalog.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --uac-admin
          --name AionSoulTracker --paths src
          --collect-submodules scapy --hidden-import tracker_ui --hidden-import pets --hidden-import catalog_ui --hidden-import catalog
          --add-data "data\pet_names.json;data"
          --add-data "data\pet_types.json;data"
          --add-data "data\pet_farm.json;data"
          src\tracker.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/AionSoulTracker.exe
          generate_release_notes: true
